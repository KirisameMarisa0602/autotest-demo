schemaVersion: "1.0"
project: derivatives-trading-demo
sourceCommit: PENDING_COMMIT
sourceCommitResolution:
  command: powershell -File scripts/stamp-commit.ps1
  behavior: Prints the current HEAD SHA without modifying tracked files; use this value as sourceCommit in generated test evidence.

suites:
  backend-green:
    default: true
    runner: Maven/JUnit
  frontend-green:
    default: true
    runner: Vitest
  external-playwright:
    default: false
    runner: External Playwright framework
  unresolved-spec:
    default: false
    runner: none

cases:
  - key: AUTH-UNAUTHENTICATED
    suite: backend-green
    oracle:
      file: docs/permissions.yaml
      operation: createTrade
    given: no X-Demo-User / X-Demo-Role headers
    when: POST /api/trades
    then: HTTP 401 with code UNAUTHENTICATED

  - key: AUTH-TRADER-CREATE
    suite: backend-green
    oracle:
      file: docs/permissions.yaml
      operation: createTrade
    given: X-Demo-Role=trader and valid create request
    when: POST /api/trades with a new Idempotency-Key
    then: HTTP 201 and DRAFT trade

  - key: AUTH-RISK-MANAGER-CREATE-DENIED
    suite: backend-green
    oracle:
      file: docs/permissions.yaml
      operation: createTrade
    given: X-Demo-Role=risk_manager
    when: POST /api/trades
    then: HTTP 403 with code FORBIDDEN

  - key: AUTH-VIEWER-CREATE-DENIED
    suite: backend-green
    oracle:
      file: docs/permissions.yaml
      operation: createTrade
    given: X-Demo-Role=viewer
    when: POST /api/trades
    then: HTTP 403 with code FORBIDDEN

  - key: HEALTH-PUBLIC
    suite: backend-green
    oracle:
      file: docs/openapi.yaml
      operation: health
    given: anonymous caller
    when: GET /api/health
    then: HTTP 200 with status UP

  - key: RESET-DEMO
    suite: backend-green
    oracle:
      file: docs/requirements/01-system-context.md
      section: "2"
    given: demo profile and any valid identity
    when: POST /api/test/reset
    then: HTTP 200 with portfolioCount=2 and marketSnapshotCount=2

  - key: VALIDATION-QUANTITY-POSITIVE
    suite: backend-green
    oracle:
      file: docs/requirements/02-trading-and-pricing.md
      section: "1"
    given: quantity is zero
    when: POST /api/trades
    then: HTTP 400 with code VALIDATION_ERROR and quantity field error

  - key: IDEMPOTENCY-SAME-BODY-REPLAY
    suite: backend-green
    oracle:
      file: docs/requirements/02-trading-and-pricing.md
      section: "2"
    given: an existing trade and the same semantic create fields
    when: POST /api/trades with the same Idempotency-Key
    then: HTTP 200, same id, no duplicate trade or audit event

  - key: IDEMPOTENCY-DIFFERENT-BODY-CONFLICT
    suite: backend-green
    oracle:
      file: docs/requirements/02-trading-and-pricing.md
      section: "2"
    given: an Idempotency-Key used by an existing trade
    when: POST /api/trades with any different create field
    then: HTTP 409 with code IDEMPOTENCY_CONFLICT

  - key: STATE-HAPPY-APPROVE
    suite: backend-green
    oracle:
      file: docs/state-machine.yaml
      path: DRAFT.submit.SUBMITTED.approve.APPROVED
    given: a DRAFT trade at version 0
    when: trader submits version 0 and risk_manager approves version 1
    then: APPROVED at version 2 with transition audit events

  - key: STATE-HAPPY-REJECT
    suite: backend-green
    oracle:
      file: docs/state-machine.yaml
      path: DRAFT.submit.SUBMITTED.reject.REJECTED
    given: a SUBMITTED trade and non-blank comment
    when: risk_manager rejects the current version
    then: REJECTED and version incremented

  - key: STATE-INVALID-DRAFT-APPROVE
    suite: backend-green
    oracle:
      file: docs/state-machine.yaml
      rule: unsupportedTransition
    given: a DRAFT trade
    when: risk_manager attempts approve
    then: HTTP 409 INVALID_TRANSITION with unchanged state and no audit event

  - key: VERSION-STALE-CONFLICT
    suite: backend-green
    oracle:
      file: docs/state-machine.yaml
      rule: staleVersion
    given: current trade version differs from expectedVersion
    when: an otherwise valid transition is requested
    then: HTTP 409 VERSION_CONFLICT with unchanged state and no audit event

  - key: PRICING-FORWARD-LONG
    suite: backend-green
    oracle:
      file: docs/requirements/02-trading-and-pricing.md
      section: "4"
    given: a future-maturity LONG forward
    when: GET /api/trades/{id}/valuation
    then: PV and Delta match formula within absolute tolerance 0.0001

  - key: PRICING-SHORT-SIGN
    suite: backend-green
    oracle:
      file: docs/requirements/02-trading-and-pricing.md
      section: "4"
    given: otherwise identical LONG and SHORT trades
    when: their single-trade valuations are read
    then: SHORT PV and Delta are the exact sign inverse within tolerance 0.0001

  - key: RISK-APPROVED-ONLY
    suite: backend-green
    oracle:
      file: docs/requirements/03-risk-audit-and-known-issues.md
      section: "1"
    given: trades in all four statuses
    when: risk_manager reads portfolio risk
    then: only APPROVED trades are counted and aggregated

  - key: RISK-SHORT-OPTION-DIRECTION
    suite: external-playwright
    defaultGreen: false
    expectedCurrentResult: FAIL
    knownProductBug: KNOWN-BUG-RISK-SHORT-OPTION-DELTA
    oracle:
      file: docs/requirements/03-risk-audit-and-known-issues.md
      section: "2"
    given: one approved SHORT European call and no other approved trades
    when: compare its signed single valuation to portfolio risk
    then: risk Delta equals the signed single valuation within tolerance 0.0001 (currently fails)

  - key: UI-APPROVE-TESTID-STALE
    suite: external-playwright
    defaultGreen: false
    expectedCurrentResult: FAIL
    knownProductBug: KNOWN-BUG-UI-APPROVE-TESTID
    oracle:
      file: docs/requirements/04-ui-test-contract.md
      section: "2"
    given: approval desk with a submitted trade
    when: locator approve-trade is used
    then: element is missing; approve-trade-old exists instead

  - key: UI-TRADER-RISK-MANAGER-FLOW
    suite: external-playwright
    defaultGreen: false
    oracle:
      file: docs/requirements/04-ui-test-contract.md
      section: "1"
    given: reset demo and browser at /login
    when: create and submit as trader, approve as risk_manager, view risk
    then: each page reflects the state and risk count is 1

  - key: SPEC-GAP-SAME-DAY-EXPIRY
    suite: unresolved-spec
    executable: false
    oracle:
      file: docs/requirements/02-trading-and-pricing.md
      section: "5"
    reason: Same-day expiry acceptance/valuation and UTC-vs-local "today" are intentionally unresolved.
