openapi: 3.1.0
info:
  title: Derivatives Trading Demo API
  version: 0.2.0
  description: |
    Contract for the deliberately non-production derivatives demo.
    Business rules and oracle tolerances are defined in docs/requirements.
    Known intentional defects are listed in docs/KNOWN-DEFECTS.md.
servers:
  - url: http://localhost:8080
security:
  - demoHeaders: []

paths:
  /api/health:
    get:
      operationId: health
      summary: Application health probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    const: UP
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /api/test/reset:
    post:
      operationId: resetDemo
      summary: Reset and seed deterministic demo data
      description: Available only when Spring profile `demo` is active.
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Database reset and reference data seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/market-data:
    get:
      operationId: listMarketData
      summary: List fixed market snapshots
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Market snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/market:
    get:
      operationId: listMarketAlias
      summary: Alias of /api/market-data
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Market snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/portfolios:
    get:
      operationId: listPortfolios
      summary: List portfolios
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/trades:
    post:
      operationId: createTrade
      summary: Idempotently create a draft trade
      x-roles: [trader]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ".*\\S.*"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTradeRequest"
      responses:
        "201":
          description: New DRAFT created
          headers:
            Location:
              schema:
                type: string
              description: /api/trades/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency key reused with a different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listTrades
      summary: List trades, optionally by portfolio
      x-roles: [trader, risk_manager, viewer]
      parameters:
        - name: portfolioCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
          example: ALPHA
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trades/{id}:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    get:
      operationId: getTrade
      summary: Get a trade
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trades/{id}/valuation:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    get:
      operationId: valueTrade
      summary: Price one trade and calculate signed Delta
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Signed valuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Valuation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trades/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    post:
      operationId: submitTrade
      summary: Move DRAFT to SUBMITTED
      x-roles: [trader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: Submitted trade with version incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TransitionConflict"

  /api/trades/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    post:
      operationId: approveTrade
      summary: Move SUBMITTED to APPROVED
      x-roles: [risk_manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Approved trade with version incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TransitionConflict"

  /api/trades/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    post:
      operationId: rejectTrade
      summary: Move SUBMITTED to REJECTED
      x-roles: [risk_manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DecisionRequest"
                - type: object
                  required: [comment]
      responses:
        "200":
          description: Rejected trade with version incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TransitionConflict"

  /api/approvals:
    get:
      operationId: listApprovals
      summary: List SUBMITTED trades awaiting decision
      x-roles: [risk_manager, viewer]
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/approvals/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    post:
      operationId: approveViaApprovals
      summary: Approve via approvals module
      x-roles: [risk_manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Approved trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "409":
          $ref: "#/components/responses/TransitionConflict"

  /api/approvals/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/TradeId"
    post:
      operationId: rejectViaApprovals
      summary: Reject via approvals module
      x-roles: [risk_manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DecisionRequest"
                - type: object
                  required: [comment]
      responses:
        "200":
          description: Rejected trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "409":
          $ref: "#/components/responses/TransitionConflict"

  /api/risk/portfolios/{portfolioCode}:
    parameters:
      - name: portfolioCode
        in: path
        required: true
        schema:
          type: string
          maxLength: 40
        example: ALPHA
    get:
      operationId: getPortfolioRisk
      summary: Aggregate approved trades and fixed spot scenarios
      x-roles: [risk_manager]
      responses:
        "200":
          description: Portfolio risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/audit-events:
    get:
      operationId: listAuditEvents
      summary: List audit events newest first
      x-roles: [trader, risk_manager, viewer]
      responses:
        "200":
          description: Audit timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    demoHeaders:
      type: apiKey
      in: header
      name: X-Demo-Role
      description: |
        Requires both X-Demo-User and X-Demo-Role.
        Optional: X-Run-Id, X-Case-Key. Create also requires Idempotency-Key.

  parameters:
    TradeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Request or business field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Missing or invalid demo identity headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated role is not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Referenced resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TransitionConflict:
      description: VERSION_CONFLICT or INVALID_TRANSITION
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ResetResponse:
      type: object
      required: [businessDate, portfolioCount, marketSnapshotCount]
      properties:
        businessDate:
          type: string
          format: date
        portfolioCount:
          type: integer
          const: 2
        marketSnapshotCount:
          type: integer
          const: 2

    MarketSnapshot:
      type: object
      required: [underlying, spot, volatility, riskFreeRate, asOf]
      properties:
        underlying:
          type: string
          examples: [AAPL]
        spot:
          type: number
          exclusiveMinimum: 0
        volatility:
          type: number
          exclusiveMinimum: 0
        riskFreeRate:
          type: number
        asOf:
          type: string
          format: date-time

    Portfolio:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 40
        name:
          type: string

    CreateTradeRequest:
      type: object
      additionalProperties: false
      required:
        - portfolioCode
        - tradeType
        - side
        - underlying
        - quantity
        - strike
        - maturity
      properties:
        portfolioCode:
          type: string
          minLength: 1
          maxLength: 40
          examples: [ALPHA]
        tradeType:
          $ref: "#/components/schemas/TradeType"
        side:
          $ref: "#/components/schemas/Side"
        underlying:
          type: string
          pattern: "^[A-Z0-9.-]+$"
          maxLength: 40
          examples: [AAPL]
        quantity:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.999999
          multipleOf: 0.000001
          examples: [10]
        strike:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.999999
          multipleOf: 0.000001
          examples: [100]
        maturity:
          type: string
          format: date
          description: |
            Dates before local "today" are invalid.
            Same-day acceptance/valuation and UTC-vs-local "today" are intentionally unspecified.
          examples: ["2027-12-31"]
        optionType:
          oneOf:
            - $ref: "#/components/schemas/OptionType"
            - type: "null"

    Trade:
      type: object
      required:
        - id
        - portfolioCode
        - tradeType
        - side
        - underlying
        - quantity
        - strike
        - maturity
        - status
        - version
        - createdAt
        - updatedAt
        - createdBy
      properties:
        id:
          type: string
          format: uuid
        portfolioCode:
          type: string
        tradeType:
          $ref: "#/components/schemas/TradeType"
        side:
          $ref: "#/components/schemas/Side"
        underlying:
          type: string
        quantity:
          type: number
        strike:
          type: number
        maturity:
          type: string
          format: date
        optionType:
          oneOf:
            - $ref: "#/components/schemas/OptionType"
            - type: "null"
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Demo actor, typically user/role
        decisionBy:
          oneOf:
            - type: string
            - type: "null"
        decisionComment:
          oneOf:
            - type: string
              maxLength: 500
            - type: "null"

    TransitionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0

    DecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        comment:
          type: string
          maxLength: 500

    Valuation:
      type: object
      required: [tradeId, presentValue, delta, currency, marketDataAsOf]
      properties:
        tradeId:
          type: string
          format: uuid
        presentValue:
          type: number
          multipleOf: 0.000001
        delta:
          type: number
          multipleOf: 0.000001
        currency:
          type: string
          const: USD
        marketDataAsOf:
          type: string
          format: date-time

    RiskReport:
      type: object
      required:
        - portfolioCode
        - approvedTradeCount
        - presentValue
        - delta
        - currency
        - scenarios
      properties:
        portfolioCode:
          type: string
        approvedTradeCount:
          type: integer
          minimum: 0
        presentValue:
          type: number
          multipleOf: 0.000001
        delta:
          type: number
          multipleOf: 0.000001
        currency:
          type: string
          const: USD
        scenarios:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/RiskScenario"

    RiskScenario:
      type: object
      required: [key, spotShockPct, stressedPresentValue, pnl]
      properties:
        key:
          type: string
          enum: [SPOT_DOWN_10, SPOT_UP_10]
        spotShockPct:
          type: number
          enum: [-0.10, 0.10]
        stressedPresentValue:
          type: number
          multipleOf: 0.000001
        pnl:
          type: number
          multipleOf: 0.000001

    AuditEvent:
      type: object
      required: [id, eventType, aggregateType, aggregateId, actor, occurredAt, details]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - DEMO_RESET
            - TRADE_CREATED
            - TRADE_SUBMITTED
            - TRADE_APPROVED
            - TRADE_REJECTED
        aggregateType:
          type: string
        aggregateId:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
        details:
          type: string

    ApiError:
      type: object
      required: [timestamp, status, code, message, path, fieldErrors]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    TradeType:
      type: string
      enum: [EUROPEAN_OPTION, FORWARD]

    Side:
      type: string
      enum: [LONG, SHORT]

    OptionType:
      type: string
      enum: [CALL, PUT]
